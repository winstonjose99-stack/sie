<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../css/estilos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario Administrativo</title>
</head>
<body>
    <header class="header-fijo">
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
        <h2>REGISTRO DE ADMINISTRADOR</h2>
        <nav>
            <ul>
                <li class="inicio"><a href="inicio.html">Inicio</a></li>
                <li><a href="iniciar_sesion.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2>Crear Cuenta Administrativa</h2>
            <p class="auth-subtitle">Complete los datos para habilitar un nuevo usuario de coordinación o gerencia.</p>

            <form action="../api/registro.php" method="POST">
                <div>
                    <label for="usuario">Nombre de Usuario:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej. coord_general" required>
                </div>

                <div>
                    <label for="contrasena">Contraseña (mínimo 6 caracteres):</label>
                    <input type="password" id="contrasena" name="contrasena" minlength="6" placeholder="••••••••" required>
                </div>

                <div>
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="correo@institucion.edu.ve" required>
                </div>

                <button type="submit">Registrar Usuario</button>
            </form>

            <div class="auth-footer">
                <span>¿Ya tiene una cuenta registrada? <a href="iniciar_sesion.html">Iniciar Sesión</a></span>
            </div>
        </div>
    </main>
</body>
</html>
